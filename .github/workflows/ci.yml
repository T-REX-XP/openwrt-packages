name: CI

on:
  push:
    branches: [main]
    paths:
      - "feeds/**"
      - ".github/**"
      - "scripts/discover-feed-packages.sh"
  pull_request:
    branches: [main]
    paths:
      - "feeds/**"
      - ".github/**"
      - "scripts/discover-feed-packages.sh"
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload built packages (normally skipped to save minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test-blocky:
    name: luci-app-blocky unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run blocky host tests
        run: feeds/luci/luci-app-blocky/tests/run-tests.sh

  test-mcu-display:
    name: luci-app-mcu-display unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run mcu-display host tests
        run: feeds/luci/luci-app-mcu-display/tests/run-tests.sh

  test-mcudd:
    name: mcudd Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: feeds/packages/mcudd/go.sum
      - name: Run mcudd host tests
        run: feeds/packages/mcudd/scripts/run-tests.sh

  test-feed-discover:
    name: discover all feed packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List feeds/{packages,luci} recipes
        run: |
          set -euo pipefail
          chmod +x scripts/discover-feed-packages.sh
          scripts/discover-feed-packages.sh . | tee /tmp/feed-packages.txt
          test "$(grep -c . /tmp/feed-packages.txt)" -ge 8
          grep -qx cm5-button-scripts /tmp/feed-packages.txt
          grep -qx snort3 /tmp/feed-packages.txt
          grep -qx suricata /tmp/feed-packages.txt

  test-threat-prevention:
    name: threat-prevention host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Run tp-eventd and LuCI checks
        run: |
          feeds/packages/tp-eventd/tests/run-tests.sh
          feeds/luci/luci-app-threat-prevention/tests/run-tests.sh

  test-snort3:
    name: luci-app-snort3 host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run snort LuCI host tests
        run: feeds/luci/luci-app-snort3/tests/run-tests.sh

  build-cm5:
    name: Orange Pi CM5 (aarch64_generic)
    needs: [test-blocky, test-mcu-display, test-mcudd, test-threat-prevention, test-snort3, test-feed-discover]
    uses: ./.github/workflows/build-packages.yml
    with:
      arch: aarch64_generic-25.12-SNAPSHOT
      pkg_arch: aarch64_generic
      fetch_depth: 1
      timeout_minutes: 180
      upload_packages: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
