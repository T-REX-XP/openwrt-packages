name: Build packages (reusable)

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      pkg_arch:
        required: true
        type: string
      index:
        required: false
        type: string
        default: "0"
      fetch_depth:
        required: false
        type: number
        default: 1
      timeout_minutes:
        required: false
        type: number
        default: 180
      upload_packages:
        required: false
        type: boolean
        default: false
      artifact_name:
        required: false
        type: string
        default: packages
      artifact_retention_days:
        required: false
        type: number
        default: 7
      prepare_release_tarball:
        required: false
        type: boolean
        default: false
    secrets:
      PRIVATE_KEY:
        required: false
      KEY_BUILD:
        required: false

permissions:
  contents: read
  actions: write

env:
  FEEDNAME: openwrt_packages
  FEED_DIR: ${{ github.workspace }}/feeds
  SDK_RELEASE: 25.12-SNAPSHOT

jobs:
  build:
    name: CM5 / ${{ inputs.pkg_arch }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Discover feed packages
        id: discover
        run: |
          set -euo pipefail
          chmod +x scripts/discover-feed-packages.sh
          scripts/discover-feed-packages.sh . | tee feed-packages.txt
          pkgs="$(tr '\n' ' ' < feed-packages.txt | xargs)"
          count="$(grep -c . feed-packages.txt)"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count feed packages: $pkgs"

      - name: Build packages (ImmortalWrt SDK)
        id: sdk
        uses: immortalwrt/gh-action-sdk@c4848d7f7d899d80e6d98630f0a21ab2e9c4724f
        env:
          ARCH: ${{ inputs.arch }}
          CONTAINER: immortalwrt/sdk
          FEEDNAME: ${{ env.FEEDNAME }}
          FEED_DIR: ${{ env.FEED_DIR }}
          PACKAGES: ${{ steps.discover.outputs.packages }}
          INDEX: ${{ inputs.index }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true
          BUILD_LOG: "1"
          V: s

      - name: List built packages
        if: always()
        run: |
          echo "=== Built packages (${{ inputs.pkg_arch }}) ==="
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) 2>/dev/null | sort || true
          echo "======================================="

      - name: Require an apk for every feed package
        if: always() && steps.sdk.outcome != 'cancelled'
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if ! find bin/packages -type f \( -name "${pkg}-*.apk" -o -name "${pkg}_*.apk" -o -name "${pkg}-*.ipk" -o -name "${pkg}_*.ipk" \) 2>/dev/null | grep -q .; then
              echo "::error::No .apk/.ipk for ${pkg} (hardcoded skip, @TARGET_* skip, or compile failure)"
              missing=1
            else
              echo "ok ${pkg}"
            fi
          done < feed-packages.txt
          if [ "$missing" -ne 0 ]; then
            echo "Feed tree must produce an artifact for every feeds/{packages,luci}/*/Makefile" >&2
            exit 1
          fi

      - name: Prepare release tarball
        if: inputs.prepare_release_tarball
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          set -euo pipefail
          FEED_SRC="bin/packages/${{ inputs.pkg_arch }}/${{ env.FEEDNAME }}"
          if [[ ! -d "$FEED_SRC" ]]; then
            echo "No feed output at $FEED_SRC" >&2
            exit 1
          fi
          if [[ ! -f "$FEED_SRC/packages.adb" ]]; then
            echo "::error::packages.adb missing — set INDEX=1 and PRIVATE_KEY for signed release builds"
            ls -la "$FEED_SRC" || true
            exit 1
          fi
          # Ship public-key.pem in the tarball for skip_build republish and offline installs.
          if [[ -n "$PUBLIC_KEY" ]]; then
            printf '%s\n' "$PUBLIC_KEY" > "$FEED_SRC/public-key.pem"
          elif [[ -n "$PRIVATE_KEY" ]]; then
            tmp="$(mktemp)"
            printf '%s\n' "$PRIVATE_KEY" | grep -v '^untrusted comment:' > "$tmp"
            {
              printf 'untrusted comment: openwrt-packages release key\n'
              openssl ec -in "$tmp" -pubout
            } > "$FEED_SRC/public-key.pem"
            rm -f "$tmp"
          fi
          TARBALL="openwrt_packages_${{ inputs.pkg_arch }}-immortalwrt-${{ env.SDK_RELEASE }}.tar.gz"
          tar -c -z -f "$TARBALL" -C "$FEED_SRC" .
          ls -la "$TARBALL"
          tar -tzf "$TARBALL" | head -25

      - name: Upload package tree
        if: inputs.upload_packages || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            bin/packages/**/*
            logs/**/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          compression-level: 6

      - name: Upload release tarball
        if: inputs.prepare_release_tarball
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ inputs.pkg_arch }}
          path: openwrt_packages_${{ inputs.pkg_arch }}-immortalwrt-${{ env.SDK_RELEASE }}.tar.gz
          if-no-files-found: error
          compression-level: 6
